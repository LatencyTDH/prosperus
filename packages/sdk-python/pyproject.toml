[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosperus-sdk"
version = "0.1.0"
description = "Python SDK for Prosperus LLM Observability"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.10",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prosperus"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
