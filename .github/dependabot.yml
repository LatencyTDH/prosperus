version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "vitest*"
          - "typescript"
      dev:
        patterns:
          - "@types/*"
          - "eslint*"
          - "vitest*"
          - "typescript"
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /packages/sdk-python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
