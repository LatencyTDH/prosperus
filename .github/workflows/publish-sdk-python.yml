name: Publish Python SDK

on:
  push:
    tags:
      - "sdk-python-v*"

jobs:
  publish:
    name: Publish `prosperus` to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Validate the SDK before publishing
        run: |
          uv sync --frozen
          uv run ruff check src/
          uv run mypy src/
          uv run pytest
          uv build
          python -m venv .wheel-smoke
          . .wheel-smoke/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python - <<'PY'
          import prosperus
          from prosperus import Prosperus

          assert prosperus.__version__ == "0.1.0"
          assert Prosperus is not None
          print("publish smoke test passed")
          PY

      - name: Publish to PyPI
        # Repo admins still need to register this workflow as a PyPI trusted publisher
        # (or provide equivalent PyPI credentials) before the first public release.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist/
